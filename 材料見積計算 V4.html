<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Calculator - Professional PC Version</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background-color: #f8f9fa; color: #333; margin: 20px; line-height: 1.6; }
        .container { background: white; max-width: 1100px; margin: auto; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 30px; display: none; }
        
        /* 語言選擇視窗 (Overlay) */
        #lang-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .lang-modal { background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .lang-modal h2 { margin-bottom: 5px; font-size: 1.5em; }
        .lang-modal p { margin-top: 0; margin-bottom: 25px; color: #666; font-size: 1em; }
        .lang-select { width: 240px; padding: 10px; font-size: 1.1em; border: 2px solid #007bff; border-radius: 6px; margin-bottom: 25px; outline: none; }
        .lang-btn { background: #007bff; color: white; padding: 10px 50px; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1em; font-weight: bold; }

        /* 分頁標籤 */
        .tabs { display: flex; border-bottom: 1px solid #dee2e6; margin-bottom: 25px; }
        .tab { padding: 12px 25px; cursor: pointer; border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0; background-color: #f1f3f5; margin-right: 5px; font-weight: bold; color: #495057; }
        .tab.active { background-color: white; border-color: #dee2e6; color: #000; position: relative; z-index: 1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .header-note { color: blue; font-weight: bold; margin-bottom: 20px; font-size: 1.1em; }
        h3 { border-left: 6px solid #007bff; padding-left: 15px; margin: 30px 0 15px 0; font-size: 1.3em; }
        .info-banner { background-color: #fff9db; border: 1px solid #ffec99; border-radius: 6px; padding: 10px 15px; margin-bottom: 15px; font-size: 0.95em; display: inline-block; }

        /* 表格設計 */
        table { border-collapse: collapse; width: 100%; margin-bottom: 25px; table-layout: fixed; }
        th, td { border: 1px solid #dee2e6; padding: 12px 8px; text-align: center; }
        th { background-color: #f1f3f5; font-size: 0.9em; color: #495057; }
        .input-box { border: 2.5px solid #000 !important; width: 90px; padding: 8px; text-align: center; font-size: 1.1em; font-weight: bold; border-radius: 4px; }
        .result-cell { background-color: #e7f5ff; font-weight: bold; color: #1971c2; font-size: 1.2em; }
        
        .settings-grid { display: flex; gap: 30px; }
        .setting-input { width: 90%; padding: 6px; border: 1px solid #ced4da; border-radius: 4px; text-align: center; }
        .notes-editor { width: 100%; height: 120px; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; margin-top: 10px; }
        .btn-save-container { text-align: center; margin-top: 40px; }
        .btn-save { background-color: #40c057; color: white; padding: 15px 60px; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        
        .footer-note { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        #display-notes { white-space: pre-wrap; font-weight: bold; color: #c92a2a; }
    </style>
</head>
<body>

<div id="lang-overlay">
    <div class="lang-modal">
        <h2>言語を選択してください</h2>
        <p>Please select your language</p>
        <select id="lang-picker" class="lang-select">
            <option value="ja" selected>日本語</option>
            <option value="en">English</option>
            <option value="zh">繁體中文</option>
            <option value="vi">Tiếng Việt</option>
        </select><br>
        <button class="lang-btn" onclick="applyLanguage()">OK</button>
    </div>
</div>

<div class="container" id="main-container">
    <div class="tabs">
        <div class="tab active" id="tab-calc" onclick="openTab(event, 'calc-page')">材料計算</div>
        <div class="tab" id="tab-setup" onclick="openTab(event, 'settings-page')">システム設定</div>
    </div>

    <div id="calc-page" class="tab-content active">
        <div class="header-note" id="ui-header-note">太い黒枠の箇所に寸法を入力してください。</div>
        
        <h3 id="ui-box-title">■ 角材 (方材)</h3>
        <div id="box-info" class="info-banner">材料情報：-</div>
        <table>
            <thead>
                <tr id="box-th-row">
                    </tr>
            </thead>
            <tbody>
                <tr>
                    <td><select id="box-select" onchange="calculate()" style="width: 90%; padding: 8px; font-size: 1em;"></select></td>
                    <td><input type="number" id="box-l" class="input-box" oninput="calculate()" onkeydown="handleEnter(event, 'box-w')"> mm</td>
                    <td><input type="number" id="box-w" class="input-box" oninput="calculate()" onkeydown="handleEnter(event, 'box-h')"> mm</td>
                    <td><input type="number" id="box-h" class="input-box" oninput="calculate()" onkeydown="handleFinalEnter(event, ['box-l','box-w','box-h'])"> mm</td>
                    <td id="box-weight" class="result-cell">0.000</td>
                    <td id="box-price" class="result-cell">¥ 0</td>
                </tr>
            </tbody>
        </table>

        <h3 id="ui-rnd-title">■ 丸材 (円材)</h3>
        <div id="round-info" class="info-banner">材料情報：-</div>
        <table>
            <thead>
                <tr id="round-th-row">
                    </tr>
            </thead>
            <tbody>
                <tr>
                    <td><select id="round-select" onchange="calculate()" style="width: 90%; padding: 8px; font-size: 1em;"></select></td>
                    <td><input type="number" id="round-d" class="input-box" oninput="calculate()" onkeydown="handleEnter(event, 'round-h')"> mm</td>
                    <td><input type="number" id="round-h" class="input-box" oninput="calculate()" onkeydown="handleFinalEnter(event, ['round-d','round-h'])"> mm</td>
                    <td>-</td>
                    <td id="round-weight" class="result-cell">0.000</td>
                    <td id="round-price" class="result-cell">¥ 0</td>
                </tr>
            </tbody>
        </table>

        <div class="footer-note">
            <h4 id="ui-note-title">※ 注意事項：</h4>
            <div id="display-notes"></div>
        </div>
    </div>

    <div id="settings-page" class="tab-content">
        <h3 id="ui-setup-title">システム設定</h3>
        <div class="settings-grid">
            <div style="flex:1;"><h4 id="ui-box-list-name">角材リスト</h4><table id="box-settings-table"></table></div>
            <div style="flex:1;"><h4 id="ui-rnd-list-name">丸材リスト</h4><table id="round-settings-table"></table></div>
        </div>
        <div style="margin-top: 30px;">
            <h4 id="ui-note-edit-title">■ 注意事項の編集</h4>
            <textarea id="notes-input" class="notes-editor"></textarea>
        </div>
        <div class="btn-save-container">
            <button class="btn-save" id="btn-save-ui" onclick="saveSettings()">設定を保存して更新</button>
        </div>
    </div>
</div>

<script>
    const i18n = {
        ja: { 
            titleCalc: "材料計算", titleSetup: "システム設定", headerNote: "太い黒枠の箇所に寸法を入力してください。", 
            boxTitle: "■ 角材 (方材)", rndTitle: "■ 丸材 (円材)", thMat: "材料選択", thL: "長さ (L)", thW: "幅 (W)", thH: "厚み (H)", thD: "直径 (D)", thWgt: "予想重量 (kg)", thPrice: "予想金額 (JPY)", 
            noteTitle: "※ 注意事項：", setupTitle: "システム設定", boxList: "角材リスト", rndList: "丸材リスト", noteEdit: "■ 注意事項の編集", saveBtn: "設定を保存して更新", 
            infoPre: "材料情報", unitPrice: "単価", density: "比重", colName: "名称", colDens: "比重", colPrice: "単価" 
        },
        en: { 
            titleCalc: "Calculator", titleSetup: "Settings", headerNote: "Please enter dimensions in the thick black boxes.", 
            boxTitle: "■ Square Bar", rndTitle: "■ Round Bar", thMat: "Material", thL: "Length (L)", thW: "Width (W)", thH: "Thickness (H)", thD: "Diameter (D)", thWgt: "Weight (kg)", thPrice: "Price (JPY)", 
            noteTitle: "※ Notes:", setupTitle: "System Settings", boxList: "Square List", rndList: "Round List", noteEdit: "■ Edit Notes", saveBtn: "Save and Update", 
            infoPre: "Info", unitPrice: "Price", density: "Density", colName: "Name", colDens: "Density", colPrice: "Price" 
        },
        zh: { 
            titleCalc: "材料計算", titleSetup: "系統設定", headerNote: "請在粗黑框欄位輸入尺寸。", 
            boxTitle: "■ 角材 (方材)", rndTitle: "■ 丸材 (圓材)", thMat: "材料選擇", thL: "長度 (L)", thW: "寬度 (W)", thH: "厚度 (H)", thD: "直徑 (D)", thWgt: "預估重量 (kg)", thPrice: "預估金額 (JPY)", 
            noteTitle: "※ 注意事項：", setupTitle: "系統設定", boxList: "方材清單", rndList: "圓材清單", noteEdit: "■ 編輯注意事項內容", saveBtn: "保存設定並更新", 
            infoPre: "材料資訊", unitPrice: "單價", density: "比重", colName: "名稱", colDens: "比重", colPrice: "單價" 
        },
        vi: { 
            titleCalc: "Tính vật liệu", titleSetup: "Cài đặt", headerNote: "Vui lòng nhập kích thước vào các ô khung đen đậm.", 
            boxTitle: "■ Thép hình vuông", rndTitle: "■ Thép tròn", thMat: "Chọn vật liệu", thL: "Chiều dài (L)", thW: "Chiều rộng (W)", thH: "Độ dày (H)", thD: "Đường kính (D)", thWgt: "Trọng lượng (kg)", thPrice: "Giá dự kiến (JPY)", 
            noteTitle: "※ Ghi chú:", setupTitle: "Cài đặt hệ thống", boxList: "Danh sách vuông", rndList: "Danh sách tròn", noteEdit: "■ Chỉnh sửa ghi chú", saveBtn: "Lưu cài đặt", 
            infoPre: "Thông tin", unitPrice: "Đơn giá", density: "Tỷ trọng", colName: "Tên", colDens: "Tỷ trọng", colPrice: "Đơn giá" 
        }
    };

    let currentLang = 'ja';

    const defB = [
        {n:"S45C", d:7.86, p:964}, {n:"SKS3", d:7.86, p:1200}, {n:"SCM", d:7.86, p:3300}, 
        {n:"SKD", d:7.86, p:3800}, {n:"SKH", d:7.86, p:4400}, {n:"SUS304", d:7.93, p:1600}, 
        {n:"AL(5052)", d:2.68, p:892}, {n:"SS400(黒皮)", d:7.86, p:232}, {n:"SU304(2B)", d:7.93, p:1250}, 
        {n:"SS400", d:7.86, p:664}, {n:"HPM7", d:7.86, p:1600}, {n:"真鍮", d:8.96, p:1600}
    ];
    const defR = [
        {n:"S45C", d:7.86, p:380}, {n:"SCM435", d:7.86, p:400}, {n:"STKM", d:7.86, p:680}, 
        {n:"SS400", d:7.86, p:260}, {n:"GO40F", d:7.86, p:1300}, {n:"SUS304 G", d:7.93, p:1430}, 
        {n:"SUJ2", d:7.8, p:650}, {n:"S45C(調質)", d:7.86, p:875}, {n:"純チタン", d:4.51, p:8400}
    ];

    function pad(data, count) { let d = [...data]; for(let i=0; i<count; i++) d.push({n:"", d:"", p:""}); return d; }

    let boxMaterials = JSON.parse(localStorage.getItem('boxPC_V3')) || pad(defB, 5);
    let roundMaterials = JSON.parse(localStorage.getItem('rndPC_V3')) || pad(defR, 5);
    let customNotes = localStorage.getItem('notesPC_V3') || "パイプ材は外径 + 3 mm\n內径 + 3 mm 寸法のばらつきが大きいため注意";

    function applyLanguage() {
        currentLang = document.getElementById('lang-picker').value;
        const lang = i18n[currentLang];
        document.getElementById('tab-calc').innerText = lang.titleCalc;
        document.getElementById('tab-setup').innerText = lang.titleSetup;
        document.getElementById('ui-header-note').innerText = lang.headerNote;
        document.getElementById('ui-box-title').innerText = lang.boxTitle;
        document.getElementById('ui-rnd-title').innerText = lang.rndTitle;
        
        // 更新計算表頭
        document.getElementById('box-th-row').innerHTML = `
            <th style="width: 25%;">${lang.thMat}</th>
            <th style="width: 15%;">${lang.thL}</th>
            <th style="width: 15%;">${lang.thW}</th>
            <th style="width: 15%;">${lang.thH}</th>
            <th style="width: 15%;">${lang.thWgt}</th>
            <th style="width: 15%;">${lang.thPrice}</th>
        `;
        document.getElementById('round-th-row').innerHTML = `
            <th style="width: 25%;">${lang.thMat}</th>
            <th style="width: 15%;">${lang.thD}</th>
            <th style="width: 15%;">${lang.thL}</th>
            <th style="width: 15%;">-</th>
            <th style="width: 15%;">${lang.thWgt}</th>
            <th style="width: 15%;">${lang.thPrice}</th>
        `;

        document.getElementById('ui-note-title').innerText = lang.noteTitle;
        document.getElementById('ui-setup-title').innerText = lang.setupTitle;
        document.getElementById('ui-box-list-name').innerText = lang.boxList;
        document.getElementById('ui-rnd-list-name').innerText = lang.rndList;
        document.getElementById('ui-note-edit-title').innerText = lang.noteEdit;
        document.getElementById('btn-save-ui').innerText = lang.saveBtn;
        
        document.getElementById('lang-overlay').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        
        renderAll();
        calculate();
    }

    function handleEnter(e, next) { if(e.key==="Enter"){ e.preventDefault(); document.getElementById(next).focus(); } }
    function handleFinalEnter(e, ids) { 
        if(e.key==="Enter"){ 
            e.preventDefault(); calculate(); 
            ids.forEach(id => document.getElementById(id).value = "");
            calculate(); document.getElementById(ids[0]).focus();
        } 
    }

    function openTab(evt, name) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function renderAll() {
        const lang = i18n[currentLang];
        const bS = document.getElementById('box-select'), rS = document.getElementById('round-select');
        bS.innerHTML = boxMaterials.map((m,i)=> m.n.trim() ? `<option value="${i}">${m.n}</option>` : "").join('');
        rS.innerHTML = roundMaterials.map((m,i)=> m.n.trim() ? `<option value="${i}">${m.n}</option>` : "").join('');
        
        const h = `<tr><th>${lang.colName}</th><th>${lang.colDens}</th><th>${lang.colPrice}</th></tr>`;
        
        document.getElementById('box-settings-table').innerHTML = h + boxMaterials.map((m,i)=>`<tr><td><input id="bn-${i}" class="setting-input" value="${m.n}"></td><td><input id="bd-${i}" class="setting-input" value="${m.d}"></td><td><input id="bp-${i}" class="setting-input" value="${m.p}"></td></tr>`).join('');
        document.getElementById('round-settings-table').innerHTML = h + roundMaterials.map((m,i)=>`<tr><td><input id="rn-${i}" class="setting-input" value="${m.n}"></td><td><input id="rd-${i}" class="setting-input" value="${m.d}"></td><td><input id="rp-${i}" class="setting-input" value="${m.p}"></td></tr>`).join('');
        document.getElementById('notes-input').value = customNotes;
        document.getElementById('display-notes').innerText = customNotes;
    }

    function saveSettings() {
        boxMaterials = boxMaterials.map((_,i)=>({n:document.getElementById(`bn-${i}`).value, d:document.getElementById(`bd-${i}`).value, p:document.getElementById(`bp-${i}`).value}));
        roundMaterials = roundMaterials.map((_,i)=>({n:document.getElementById(`rn-${i}`).value, d:document.getElementById(`rd-${i}`).value, p:document.getElementById(`rp-${i}`).value}));
        customNotes = document.getElementById('notes-input').value;
        localStorage.setItem('boxPC_V3', JSON.stringify(boxMaterials));
        localStorage.setItem('rndPC_V3', JSON.stringify(roundMaterials));
        localStorage.setItem('notesPC_V3', customNotes);
        renderAll(); calculate(); alert("Saved!");
    }

    function calculate() {
        const lang = i18n[currentLang];
        const bi = document.getElementById('box-select').value;
        if(bi!==""){
            const m = boxMaterials[bi], d = parseFloat(m.d)||0, p = parseFloat(m.p)||0;
            document.getElementById('box-info').innerText = `${lang.infoPre}：${m.n} | ${lang.unitPrice} ¥ ${p} | ${lang.density} ${d}`;
            const w = (parseFloat(document.getElementById('box-l').value||0)*parseFloat(document.getElementById('box-w').value||0)*parseFloat(document.getElementById('box-h').value||0)*d)/1000000;
            document.getElementById('box-weight').innerText = w.toFixed(3);
            document.getElementById('box-price').innerText = "¥ " + Math.round(w*p).toLocaleString();
        }
        const ri = document.getElementById('round-select').value;
        if(ri!==""){
            const m = roundMaterials[ri], d = parseFloat(m.d)||0, p = parseFloat(m.p)||0;
            document.getElementById('round-info').innerText = `${lang.infoPre}：${m.n} | ${lang.unitPrice} ¥ ${p} | ${lang.density} ${d}`;
            const w = (Math.pow(parseFloat(document.getElementById('round-d').value||0)/2, 2)*Math.PI*parseFloat(document.getElementById('round-h').value||0)*d)/1000000;
            document.getElementById('round-weight').innerText = w.toFixed(3);
            document.getElementById('round-price').innerText = "¥ " + Math.round(w*p).toLocaleString();
        }
    }
    renderAll();
</script>
</body>
</html>
